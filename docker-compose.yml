# =============================================================================
# Food Delivery System - full stack orchestration
#
#   db        PostgreSQL 16, schema + seed applied automatically on first start
#   backend   Node.js / Express REST API
#   frontend  React SPA served by nginx, reverse-proxying /api to the backend
#   adminer   Lightweight web client used to inspect the database
#
# Start everything with:   docker compose up -d --build
# =============================================================================

name: food-delivery-system

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: fds-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-food_delivery}
      POSTGRES_USER: ${POSTGRES_USER:-fooddelivery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fooddelivery_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Named volume - data survives `docker compose down` and container rebuilds.
      - db_data:/var/lib/postgresql/data
      # Everything in this directory is executed once, when the volume is empty.
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fooddelivery} -d ${POSTGRES_DB:-food_delivery}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app-network

  # ---------------------------------------------------------------------------
  # Backend REST API
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: food-delivery-backend:1.0.0
    container_name: fds-backend
    restart: unless-stopped
    depends_on:
      db:
        # The API only starts once PostgreSQL reports healthy.
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      # `db` is the service name; Docker's embedded DNS resolves it on app-network.
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-food_delivery}
      DB_USER: ${POSTGRES_USER:-fooddelivery}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-fooddelivery_pass}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-500}
    ports:
      # Published so the API can be exercised directly (Postman, curl, tests).
      - "${BACKEND_PORT:-4000}:4000"
    networks:
      - app-network

  # ---------------------------------------------------------------------------
  # Frontend (React build served by nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: food-delivery-frontend:1.0.0
    container_name: fds-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - app-network

  # ---------------------------------------------------------------------------
  # Adminer - browser based database client (development convenience)
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:4-standalone
    container_name: fds-adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha
    # Adminer's default command binds the PHP development server to "[::]:8080".
    # Binding explicitly to 0.0.0.0 keeps the container working on hosts where
    # IPv6 is not enabled inside the Docker network.
    command: ["php", "-S", "0.0.0.0:8080", "-t", "/var/www/html"]
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    networks:
      - app-network

# -----------------------------------------------------------------------------
# Named volumes and networks
# -----------------------------------------------------------------------------
volumes:
  db_data:
    driver: local

networks:
  app-network:
    driver: bridge
