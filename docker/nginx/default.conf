# =============================================================================
# nginx configuration for the frontend container.
#
# Two responsibilities:
#   1. Serve the compiled React single-page application.
#   2. Reverse-proxy every /api/* request to the backend container, so the
#      browser only ever talks to one origin (no CORS pre-flight required).
# =============================================================================

upstream backend_api {
    # `backend` is the Docker Compose service name; Docker's embedded DNS
    # resolves it to the container's address on the app network.
    server backend:4000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- logging ------------------------------------------------------------
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # --- static asset caching ----------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- API reverse proxy --------------------------------------------------
    location /api/ {
        proxy_pass         http://backend_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # --- client-side routing ------------------------------------------------
    # Any unknown path falls back to index.html so React Router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- hardening ----------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
